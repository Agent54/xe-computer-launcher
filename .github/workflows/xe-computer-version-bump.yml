name: Update bundled Xe Computer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released Xe Computer version, without the leading v (for example 1.2.3)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-xe-computer:
    uses: ./.github/workflows/component-updates.yml
    with:
      component: xe-computer
      release_tag: v${{ inputs.version }}
    secrets: inherit
