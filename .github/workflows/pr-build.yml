name: Launcher Integration Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  launcher-integration:
    runs-on: [self-hosted, macOS, ARM64, xe-mac]

    # Available to every step in this job.
    env:
      DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
      NOTARY_PROFILE: notarytool-profile
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      # Current runners are VMs without nested virtualization. Set the repo
      # variable to 1 when moving to hardware runners.
      XE_TEST_SUB_VM_AVAILABLE: ${{ vars.XE_CI_SUB_VM_AVAILABLE || '0' }}

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Install Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" |
            base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      - name: Configure notarization
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

          echo -n "$NOTARY_KEY_BASE64" |
            base64 --decode -o "$NOTARY_KEY_PATH"

          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"

      - name: Install build dependencies
        run: |
          for formula in create-dmg gh; do
            if ! brew list --formula "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          done

      - name: Build complete launcher DMG
        env:
          GH_TOKEN: ${{ secrets.SMOLVM_GITHUB_TOKEN }}
        working-directory: macos
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure SMOLVM_GITHUB_TOKEN with read access to Agent54/smol-compose and Agent54/compose-server."
            exit 1
          fi
          make compose-server
          swift test
          make

      - name: Verify Sparkle bundle integration
        run: macos/Tests/Integration/verify-sparkle.sh "macos/dist/Xe Launcher.app" --release --channel stable

      - name: Run full launcher integration test
        run: macos/Tests/Integration/install-from-dmg.sh

      - name: Verify version in About dialog
        run: macos/Tests/Integration/about-version.sh
