name: Build, Test, and Release Launcher


on:
  push:
    branches:
      - int
      - main

permissions:
  contents: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64, xe-mac]
    timeout-minutes: 60
    env:
      NOTARY_PROFILE: notarytool-profile
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}

    steps:
      - name: Configure temporary paths
        shell: bash
        run: |
          echo "NOTARY_KEYCHAIN=$RUNNER_TEMP/app-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.keychain-db" >> "$GITHUB_ENV"
          echo "ORIGINAL_KEYCHAINS=$RUNNER_TEMP/original-keychains-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt" >> "$GITHUB_ENV"

      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset launcher integration environment
        run: bash macos/Tests/Integration/cleanup.sh

      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          latest_version=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_version="$candidate"
              break
            fi
          done < <(git tag --sort=-version:refname)

          if [[ -z "$latest_version" ]]; then
            latest_version="0.0.0"
          fi

          IFS=. read -r major minor patch <<< "$latest_version"
          version="$major.$minor.$((patch + 1))"

          if [[ "$GITHUB_REF_NAME" == "int" ]]; then
            release_tag="$version-int.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
            prerelease="true"
            update_channel="int"
          else
            release_tag="$version"
            prerelease="false"
            update_channel="stable"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "update_channel=$update_channel" >> "$GITHUB_OUTPUT"
          echo "Building Xe Launcher $version for release $release_tag"

          if [[ -z "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo "::error::Actions secret SPARKLE_PUBLIC_ED_KEY is not configured."
            exit 1
          fi
          if [[ ! "$SPARKLE_PUBLIC_ED_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "::error::Actions secret SPARKLE_PUBLIC_ED_KEY is not a base64-encoded Ed25519 public key."
            exit 1
          fi

          plutil -replace CFBundleShortVersionString \
            -string "$version" \
            macos/Sources/macos/Info.plist
          plutil -replace CFBundleVersion \
            -string "$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            macos/Sources/macos/Info.plist
          plutil -replace XeReleaseVersion \
            -string "$release_tag" \
            macos/Sources/macos/Info.plist
          plutil -replace XeUpdateChannel \
            -string "$update_channel" \
            macos/Sources/macos/Info.plist
          plutil -replace SUPublicEDKey \
            -string "$SPARKLE_PUBLIC_ED_KEY" \
            macos/Sources/macos/Info.plist
          plutil -replace SUFeedURL \
            -string "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/updates/$update_channel/appcast.xml" \
            macos/Sources/macos/Info.plist

      - name: Install Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"

          security list-keychains -d user |
            sed -E 's/^[[:space:]]*"(.*)"$/\1/' > "$ORIGINAL_KEYCHAINS"

          echo -n "$BUILD_CERTIFICATE_BASE64" |
            base64 --decode -o "$certificate_path"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$NOTARY_KEYCHAIN"
          security set-keychain-settings \
            -lut 21600 \
            "$NOTARY_KEYCHAIN"
          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$NOTARY_KEYCHAIN"
          security import "$certificate_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$NOTARY_KEYCHAIN"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$NOTARY_KEYCHAIN"

          original_keychains=()
          while IFS= read -r keychain; do
            [[ -n "$keychain" ]] && original_keychains+=("$keychain")
          done < "$ORIGINAL_KEYCHAINS"
          security list-keychains \
            -d user \
            -s "$NOTARY_KEYCHAIN" "${original_keychains[@]}"
          developer_id="$(
            security find-identity \
              -v \
              -p codesigning \
              "$NOTARY_KEYCHAIN" |
              awk -F '"' '/Developer ID Application:/ { print $2; exit }'
          )"

          if [[ -z "$developer_id" ]]; then
            echo "::error::The imported P12 does not contain a Developer ID Application identity."
            exit 1
          fi

          echo "DEVELOPER_ID=$developer_id" >> "$GITHUB_ENV"
          echo "Using signing identity: $developer_id"

      - name: Configure notarization
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          notary_key_path="$RUNNER_TEMP/AuthKey.p8"

          echo -n "$NOTARY_KEY_BASE64" |
            base64 --decode -o "$notary_key_path"

          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$notary_key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$NOTARY_KEYCHAIN"

      - name: Install build dependencies
        shell: bash
        run: |
          for formula in create-dmg gh; do
            if ! brew list --formula "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          done

      - name: Build complete launcher DMG
        env:
          GH_TOKEN: ${{ secrets.SMOLVM_GITHUB_TOKEN }}
        working-directory: macos
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure SMOLVM_GITHUB_TOKEN with read access to Agent54/smol-compose."
            exit 1
          fi
          make

      - name: Verify Sparkle bundle integration
        run: macos/Tests/Integration/verify-sparkle.sh "macos/dist/Xe Launcher.app" --release --channel "${{ steps.version.outputs.update_channel }}"

      - name: Run full launcher integration test
        env:
          DMG_PATH: ${{ github.workspace }}/macos/dist/Xe Launcher.dmg
        run: macos/Tests/Integration/install-from-dmg.sh

      - name: Verify version in About dialog
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.release_tag }}
        run: macos/Tests/Integration/about-version.sh

      - name: Generate signed Sparkle appcast
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::Repository secret SPARKLE_PRIVATE_KEY is not configured."
            exit 1
          fi

          update_dir="$RUNNER_TEMP/sparkle-update"
          mkdir -p "$update_dir"
          cp "macos/dist/Xe Launcher.dmg" "$update_dir/Xe-Launcher.dmg"

          {
            echo "# Xe Launcher $RELEASE_TAG"
            echo
            echo "See the GitHub release for the complete notes:"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          } > "$update_dir/Xe-Launcher.md"

          generate_appcast="macos/.build/artifacts/sparkle/Sparkle/bin/generate_appcast"
          if [[ ! -x "$generate_appcast" ]]; then
            echo "::error::Sparkle generate_appcast tool was not found at $generate_appcast"
            exit 1
          fi
          sign_update="macos/.build/artifacts/sparkle/Sparkle/bin/sign_update"
          if [[ ! -x "$sign_update" ]]; then
            echo "::error::Sparkle sign_update tool was not found at $sign_update"
            exit 1
          fi

          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
              --embed-release-notes \
              --maximum-deltas 0 \
              --link "https://github.com/$GITHUB_REPOSITORY" \
              -o "$update_dir/appcast.xml" \
              "$update_dir"

          test -s "$update_dir/appcast.xml"
          grep -q 'sparkle:edSignature=' "$update_dir/appcast.xml"

          # Keep CFBundleShortVersionString numeric for macOS, but expose the
          # fully qualified release tag (including the int build suffix) in
          # Sparkle's update UI.
          sed -i '' -E \
            "s|(<sparkle:shortVersionString>)[^<]*(</sparkle:shortVersionString>)|\\1${RELEASE_TAG}\\2|g" \
            "$update_dir/appcast.xml"
          grep -Fq "<sparkle:shortVersionString>${RELEASE_TAG}</sparkle:shortVersionString>" \
            "$update_dir/appcast.xml"
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$sign_update" \
              --ed-key-file - \
              "$update_dir/appcast.xml"
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$sign_update" \
              --verify \
              --ed-key-file - \
              "$update_dir/appcast.xml"
          echo "SPARKLE_UPDATE_DIR=$update_dir" >> "$GITHUB_ENV"

      - name: Create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          release_flags=(--generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi

          gh release create "$RELEASE_TAG" \
            "$SPARKLE_UPDATE_DIR/Xe-Launcher.dmg" \
            "$SPARKLE_UPDATE_DIR/appcast.xml" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Xe Launcher $RELEASE_TAG" \
            "${release_flags[@]}"

      - name: Publish Sparkle channel feed
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_CHANNEL: ${{ steps.version.outputs.update_channel }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          if ! gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/updates" \
            --silent >/dev/null 2>&1; then
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/heads/updates" \
              --field sha="$GITHUB_SHA" \
              --silent
          fi

          feed_path="$UPDATE_CHANNEL/appcast.xml"
          existing_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/contents/$feed_path?ref=updates" \
              --jq .sha 2>/dev/null || true
          )"
          encoded_feed="$(base64 < "$SPARKLE_UPDATE_DIR/appcast.xml" | tr -d '\n')"

          api_args=(
            --method PUT
            "repos/$GITHUB_REPOSITORY/contents/$feed_path"
            --field message="Publish $UPDATE_CHANNEL Sparkle feed for $RELEASE_TAG"
            --field content="$encoded_feed"
            --field branch=updates
            --silent
          )
          if [[ -n "$existing_sha" ]]; then
            api_args+=(--field sha="$existing_sha")
          fi

          gh api "${api_args[@]}"

      - name: Verify published Sparkle channel feed
        env:
          UPDATE_CHANNEL: ${{ steps.version.outputs.update_channel }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          feed_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/updates/$UPDATE_CHANNEL/appcast.xml"
          asset_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Xe-Launcher.dmg"
          macos/Tests/Integration/verify-appcast.sh \
            "$feed_url" \
            "$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            "$asset_url" \
            "$RELEASE_TAG"

      - name: Announce release on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::The DISCORD_WEBHOOK_URL repository secret is not configured."
            exit 1
          fi

          release_kind="release"
          if [[ "$PRERELEASE" == "true" ]]; then
            release_kind="prerelease"
          fi

          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          payload="$(printf \
            '{"content":"Xe Launcher %s %s is available: %s"}' \
            "$RELEASE_TAG" "$release_kind" "$release_url")"

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            --output /dev/null \
            "$DISCORD_WEBHOOK_URL"

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -s "$ORIGINAL_KEYCHAINS" ]]; then
            original_keychains=()
            while IFS= read -r keychain; do
              [[ -n "$keychain" ]] && original_keychains+=("$keychain")
            done < "$ORIGINAL_KEYCHAINS"
            security list-keychains \
              -d user \
              -s "${original_keychains[@]}"
          fi

          security delete-keychain "$NOTARY_KEYCHAIN" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/AuthKey.p8" \
            "$ORIGINAL_KEYCHAINS"
