name: Launcher Integration Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  launcher-integration:
    runs-on: [self-hosted, macOS, ARM64, xe-mac]

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Build complete launcher DMG
        working-directory: macos
        run: make

      - name: Run full launcher integration test
        run: macos/Tests/Integration/install-from-dmg.sh
